name: 대시보드 자동 갱신

on:
  schedule:
    - cron: "40 1 1-3,11-13,21-23 * *"
    - cron: "10 0 16-19 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 조기 신호 (10일 잠정치)
        if: github.event.schedule != '10 0 16-19 * *'
        continue-on-error: true
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          python3 early.py --key "$KEY"
          code=$?
          if [ "$code" = "2" ]; then echo "새 기간 없음"; exit 0; fi
          if [ "$code" != "0" ]; then echo "early.py 실패 (종료코드 $code)"; exit 1; fi

      - name: 월간 확정치 (시도별 급변 품목)
        if: github.event.schedule == '10 0 16-19 * *'
        continue-on-error: true
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          python3 collect.py --key "$KEY" --budget 9500
          code=$?
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then echo "collect.py 실패 (종료코드 $code)"; exit 1; fi
          python3 shares.py --key "$KEY" || true

      - name: 페이지 만들기
        run: python3 build.py

      - name: 저장소에 반영
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html analysis.json sgg_latest.json shares.json names.json companies.json early.json
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "자동 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
